name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: qodex-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify release build (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build -v -ldflags="-X main.version=${GITHUB_REF_NAME#v} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/qodex

      - name: Validate release tag and version
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use semantic versioning: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag does not point to a commit reachable from main"
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then binary="./qodex.exe"; else binary="./qodex"; fi
          actual="$(${binary} version | awk '/^qodex version / {print $3}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Binary version ${actual} does not match tag ${expected}"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -count=1 ./...

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Validate signing configuration
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [[ -z "${GPG_PRIVATE_KEY}" || -z "${GPG_FINGERPRINT}" || -z "${GPG_PASSPHRASE}" ]]; then
            echo "GPG_PRIVATE_KEY, GPG_FINGERPRINT, and GPG_PASSPHRASE must be configured for public signed releases."
            exit 1
          fi

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}

      - name: Export public signing key
        run: |
          public_key="${RUNNER_TEMP}/qodex-gpg-public-key.asc"
          gpg --armor --export "${GPG_FINGERPRINT}" > "${public_key}"
          test -s "${public_key}"
        env:
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.8.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

      - name: Verify release checksums and signatures
        run: |
          test -s dist/checksums.txt
          while read -r checksum artifact; do
            echo "${checksum}  dist/${artifact}" | sha256sum --check --status -
          done < dist/checksums.txt
          for signature in dist/*.sig; do
            artifact="${signature%.sig}"
            gpg --verify "${signature}" "${artifact}"
          done

      - name: Upload public signing key
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/qodex-gpg-public-key.asc

  install-smoke:
    name: "Verify published install (${{ matrix.os }})"
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install and run published artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          QODEX_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          install_dir="${RUNNER_TEMP}/qodex-install"
          bash scripts/install.sh --version "${QODEX_RELEASE_VERSION}" --dir "${install_dir}"
          "${install_dir}/qodex" version | grep -F "qodex version ${QODEX_RELEASE_VERSION#v}"

      - name: Install and run published artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QODEX_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "qodex-install"
          & "$PWD/scripts/install.ps1" -Version $env:QODEX_RELEASE_VERSION -InstallDir $installDir
          $binary = Join-Path $installDir "qodex.exe"
          & $binary version | Select-String "qodex version $($env:QODEX_RELEASE_VERSION.TrimStart('v'))"
