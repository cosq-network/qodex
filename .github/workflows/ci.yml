name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qodex-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "go mod tidy changed files; run go mod tidy locally" && exit 1)

      - name: Lint
        uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          args: --timeout 5m

  test:
    name: "Test (${{ matrix.go }}, ${{ matrix.os }})"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        env:
          CGO_ENABLED: 0
        run: |
          VERSION="dev-${GITHUB_SHA:0:7}"
          go build -v -ldflags="-X main.version=${VERSION} -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/qodex

      - name: CLI smoke test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./qodex.exe version
            ./qodex.exe --help >/dev/null
          else
            ./qodex version
            ./qodex --help >/dev/null
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

  packaging:
    name: Packaging snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          version: v2.8.2
          install-only: true

      - name: Validate release packaging
        run: goreleaser release --snapshot --clean --skip=publish,sign
